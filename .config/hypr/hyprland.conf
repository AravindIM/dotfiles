source=mocha.conf

$mainMod = ALT
$terminal = alacritty
$browser = firefox
$filemanager = thunar
$menu = rofi -show combi
$lock = hyprlock
$logout = wlogout
$screenshot = hyprshot -m region -z
$clipboard = cliphist list | rofi -dmenu | cliphist decode | wl-copy
$clipboardClear = cliphist wipe

monitor=,preferred,auto,1.25

general {
  border_size=2
  gaps_in=5
  gaps_out=7
  col.active_border=rgba($mauveAlphaee)
  col.inactive_border=rgba($flamingoAlphaaa)
  layout=dwindle
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true
  font_family=Jetbrains Mono Nerd Font
  vrr=true
  enable_swallow=true
}

decoration {
  rounding=5
  active_opacity=1
  inactive_opacity=0.93
  fullscreen_opacity=1
}

animations {
  enabled=true
  bezier = myBezier,0.1,0.7,0.1,1.05
  animation=fade,1,2,default
  animation=windows,1,2,myBezier
  animation=windowsOut,1,3,default,popin 60%
  animation=windowsMove,1,2,myBezier
}

input {
  kb_layout=us
  kb_options=caps:ctrl_modifier
  follow_mouse=1
  repeat_delay=250
  numlock_by_default=1
  accel_profile=flat
  sensitivity=0.8
  touchpad {
    natural_scroll=true
    middle_button_emulation=true
    tap-to-click=false
  }
}

gestures {
  workspace_swipe=true
  workspace_swipe_fingers=3
  workspace_swipe_distance=100
}

dwindle {
  pseudotile=false
  force_split=2
  preserve_split=true
}

debug {
  damage_tracking=2
}

bindm=$mainMod,mouse:272,movewindow
bindm=$mainMod,mouse:273,resizewindow

bind=$mainMod,Return,exec,$terminal
bind=$mainMod,Q,killactive,
bind=$mainMod SHIFT,Q,exec,$logout
bind=$mainMod,X,exec,$lock
bind=$mainMod SHIFT,F,exec,$filemanager
bind=$mainMod,B,exec,$browser
bind=$mainMod,P,exec,$menu
bind=$mainMod,V,exec,$clipboard
bind=$mainMod CTRL,V,exec,$clipboardClear

bind=$mainMod SHIFT,P,pseudo,
bind=$mainMod,F,fullscreen,
bind=$mainMod,R,forcerendererreload
bind=$mainMod SHIFT,R,exec,hyprctl reload
bind=$mainMod,T,togglefloating,
bind=$mainMod SHIFT,T,fullscreen,1

bind=$mainMod,left,movefocus,l
bind=$mainMod,right,movefocus,r
bind=$mainMod,up,movefocus,u
bind=$mainMod,down,movefocus,d

bind=$mainMod,H,movefocus,l
bind=$mainMod,L,movefocus,r
bind=$mainMod,K,movefocus,u
bind=$mainMod,J,movefocus,d

bind=$mainMod SHIFT,left,movewindow,l
bind=$mainMod SHIFT,right,movewindow,r
bind=$mainMod SHIFT,up,movewindow,u
bind=$mainMod SHIFT,down,movewindow,d

bind=$mainMod SHIFT,H,movewindow,l
bind=$mainMod SHIFT,L,movewindow,r
bind=$mainMod SHIFT,K,movewindow,u
bind=$mainMod SHIFT,J,movewindow,d

bind=$mainMod,SPACE,togglesplit

bind=$mainMod,1,workspace,1
bind=$mainMod,2,workspace,2
bind=$mainMod,3,workspace,3
bind=$mainMod,4,workspace,4
bind=$mainMod,5,workspace,5
bind=$mainMod,6,workspace,6
bind=$mainMod,7,workspace,7
bind=$mainMod,8,workspace,8
bind=$mainMod,9,workspace,9
bind=$mainMod,0,workspace,10

bind=$mainMod SHIFT,1,movetoworkspace,1
bind=$mainMod SHIFT,2,movetoworkspace,2
bind=$mainMod SHIFT,3,movetoworkspace,3
bind=$mainMod SHIFT,4,movetoworkspace,4
bind=$mainMod SHIFT,5,movetoworkspace,5
bind=$mainMod SHIFT,6,movetoworkspace,6
bind=$mainMod SHIFT,7,movetoworkspace,7
bind=$mainMod SHIFT,8,movetoworkspace,8
bind=$mainMod SHIFT,9,movetoworkspace,9
bind=$mainMod SHIFT,0,movetoworkspace,10

bind=$mainMod CTRL,right,resizeactive,20 0
bind=$mainMod CTRL,left,resizeactive,-20 0
bind=$mainMod CTRL,up,resizeactive,0 -20
bind=$mainMod CTRL,down,resizeactive,0 20

bind=$mainMod CTRL,l,resizeactive,20 0
bind=$mainMod CTRL,h,resizeactive,-20 0
bind=$mainMod CTRL,k,resizeactive,0 -20
bind=$mainMod CTRL,j,resizeactive,0 20

bind=,PRINT,exec,$screenshot

bind=,XF86AudioLowerVolume,exec,pamixer -d 10
bind=,XF86AudioRaiseVolume,exec,pamixer -i 10
bind=SHIFT,XF86AudioLowerVolume,exec,pamixer -d 10 --allow-boost
bind=SHIFT,XF86AudioRaiseVolume,exec,pamixer -i 10 --allow-boost
bind=,XF86AudioMute,exec,pamixer -t
bind=,XF86AudioMicMute,exec,pamixer --default-source -t
bind=,XF86MonBrightnessDown,exec,light -U 5
bind=,XF86MonBrightnessUP,exec,light -A 5

windowrule=float,title:^(Volume Control)$
windowrule=float,title:^(Picture-in-Picture)$
windowrule=pin,title:^(Picture-in-Picture)$
windowrule=move 75% 75% ,title:^(Picture-in-Picture)$
windowrule=size 24% 24% ,title:^(Picture-in-Picture)$

env=HYPRCURSOR_THEME,Catppuccin Mocha Dark
env=HYPRCURSOR_SIZE,24

exec-once=dbus-update-activation-environment --systemd --all
exec-once=xdph
exec-once=swaync
exec-once=hypridle
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=waybar
exec-once=blueman-applet
exec-once=nm-applet --indicator
exec-once=swww-daemon
exec-once=waypaper --restore
